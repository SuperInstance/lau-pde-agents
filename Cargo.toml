[package]
name = "lau-pde-agents"
version = "0.1.0"
edition = "2021"
description = "Partial differential equations for agent dynamics — PDEs governing agent belief propagation, diffusion, oscillation, and equilibrium"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-pde-agents"
keywords = ["pde", "agents", "diffusion", "simulation", "numerical"]
categories = ["mathematics", "science", "simulation"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
